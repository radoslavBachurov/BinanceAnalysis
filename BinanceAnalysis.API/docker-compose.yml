
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: binanceanalysis-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/127.0.0.1/1433'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binanceanalysis-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BinanceAnalysis;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true;"

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpirationMinutes: "60"

      AdminCredentials__Username: ${ADMIN_USERNAME}
      AdminCredentials__Password: ${ADMIN_PASSWORD}

    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
